[workspace]
members = [
    "crates/phoenix-alex",
    "crates/phoenix-analytics",
    "crates/phoenix-chat",
    "crates/phoenix-chunker",
    "crates/phoenix-graph",
    "crates/phoenix-graph-native",
    "crates/phoenix-gldr",
    "crates/phoenix-graptor",
    "crates/phoenix-lex",
    "crates/phoenix-native",
    "crates/phoenix-om",
    "crates/phoenix-om-graptor",
    "crates/phoenix-perf",
    "crates/phoenix-qgram",
    "crates/phoenix-runtime",
    "crates/phoenix-scanner",
    "crates/phoenix-store-cozo",
    "crates/phoenix-store-kyu",
    "crates/phoenix-structure",
    "crates/phoenix-triverse",
    "crates/phoenix-types",
    "crates/phoenix-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["KittClouds"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
daachorse = "=0.4.1"
bincode = "1.3"
rmp-serde = "1.3"
fst = "0.4"
roaring = "0.10"
thiserror = "1.0"
lz4_flex = "0.11"
smallvec = "1.15"
rustc-hash = "1.1"
zerocopy = { version = "0.7", features = ["derive"] }
memchr = "2.7"
stop-words = "0.9"
openrouter-rs = "0.4.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[patch.crates-io]
graph_builder = { path = "vendor/graph_builder" }
kyu-copy = { path = "vendor/kyu-copy" }
arrow-arith = { path = "vendor/arrow-arith" }
