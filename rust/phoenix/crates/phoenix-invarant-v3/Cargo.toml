[package]
name = "phoenix-invarant-v3"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
lz4_flex.workspace = true
memchr.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
rayon = "1.11"
scirs2-text = "0.4.1"
gline-rs = { version = "1.0", optional = true }
orp = { version = "0.9", optional = true }
phoenix-chunker = { path = "../phoenix-chunker" }
phoenix-graph = { path = "../phoenix-graph" }
phoenix-graph-kernel = { path = "../phoenix-graph-kernel" }
phoenix-semantic-v2 = { path = "../phoenix-semantic-v2" }
phoenix-store-native-core = { path = "../phoenix-store-native-core" }
phoenix-types = { path = "../phoenix-types" }

[dev-dependencies]
phoenix-store-lmdb = { path = "../phoenix-store-lmdb" }

[features]
default = []
background-verifier = ["dep:gline-rs", "dep:orp"]
