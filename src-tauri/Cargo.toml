[package]
name = "phoenix-tauri"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "phoenix_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
phoenix-native = { path = "../rust/phoenix/crates/phoenix-native" }
phoenix-types = { path = "../rust/phoenix/crates/phoenix-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
tauri = { version = "2", features = [] }
taurpc = "0.7.1"
tokio = { version = "1", features = ["full"] }
