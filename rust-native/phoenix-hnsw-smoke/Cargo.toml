[package]
name = "phoenix-hnsw-smoke"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = "0.10.2"
candle-onnx = "0.10.2"
phoenix-hyperbolic = { path = "../phoenix/crates/phoenix-hyperbolic" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
