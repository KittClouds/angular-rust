[package]
name = "phoenix-ingest-overgraph"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
daachorse.workspace = true
lz4_flex.workspace = true
memchr.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
rustc-hash.workspace = true
stop-words.workspace = true
thiserror.workspace = true
rayon = "1.11"
scirs2-text = { version = "0.4.1", features = ["simd"] }
gline-rs = { version = "1.0", optional = true }
orp = { version = "0.9", optional = true }
phoenix-chunker = { path = "../phoenix-chunker" }
phoenix-alex = { path = "../phoenix-alex" }
phoenix-causality = { path = "../phoenix-causality" }
phoenix-graph = { path = "../phoenix-graph" }
phoenix-kernel = { path = "../phoenix-kernel" }
phoenix-machine = { path = "../phoenix-machine" }
phoenix-proposition = { path = "../phoenix-proposition" }
phoenix-semantic-v2 = { path = "../phoenix-semantic-v2" }
phoenix-store-native-core = { path = "../phoenix-store-native-core" }
phoenix-time = { path = "../phoenix-time" }
phoenix-types = { path = "../phoenix-types" }

[dev-dependencies]
phoenix-store-overgraph = { path = "../phoenix-store-overgraph" }

[features]
default = []
background-verifier = ["dep:gline-rs", "dep:orp"]
